name = "stock-lab-sync"
main = "cloudflare/worker.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "stock-lab-sync"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "STOCKLAB_BACKUPS"
bucket_name = "stock-lab-backups"

[vars]
ALLOWED_ORIGIN = "https://REPLACE_WITH_YOUR_STOCKLAB_DOMAIN"
